name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests sin red
        run: |
          python tests/test_offline.py
          python tests/test_agente.py
      - name: Métricas del retriever (para comparar entre PRs)
        run: python scripts/evaluar_retriever.py | tail -1 >> "$GITHUB_STEP_SUMMARY"
